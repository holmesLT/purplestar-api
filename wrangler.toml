name = "purplestar-api"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# Cron trigger — 链上 XRP watcher 每 2 分钟跑一次
# 注意:CF 免费版 cron 最小间隔是 1 分钟,但 watcher 每 2 分钟跑够用
[triggers]
crons = ["*/2 * * * *"]

# Workers 路由 — Custom Domain 绑到 api.purplestar.cc
# 在 Cloudflare Dashboard 配置:Workers & Pages → purplestar-api → Settings → Triggers → Custom Domains → 添加 api.purplestar.cc

[vars]
SITE_URL = "https://purplestar.cc"
# 同时允许新老域名过渡期调用(老域名还在 301 重定向)
ALLOWED_ORIGIN = "https://purplestar.cc"
XRP_USD_PRICE_URL = "https://api.coingecko.com/api/v3/simple/price?ids=ripple&vs_currencies=usd"
USDT_USD_PRICE_URL = "https://api.coingecko.com/api/v3/simple/price?ids=tether&vs_currencies=usd"

# D1 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "purplestar-db"
database_id = "e01d5909-3e31-4e21-b2d0-2862331b5909"  # wrangler d1 create 后填入

# 密钥通过 wrangler secret put 设置（不入版本控制）
# ANTHROPIC_API_KEY
# STRIPE_SECRET_KEY
# STRIPE_WEBHOOK_SECRET

[observability]
enabled = true
